# Schemalagd insamling. Kör insamlaren i GitHub Actions och committar
# data/snapshot-latest.json tillbaka till repot. Pages publicerar från main,
# så en commit hit räcker för att sajten uppdateras.
#
# Ingen server, ingen databas, ingen kostnad. När du vill ha historik längre
# tillbaka än en körning byter du målet till Supabase i stället -- se
# supabase/migrations/0001_fyndindex.sql.
name: Samla in trenddata

on:
  schedule:
    # 05:12 UTC varje dag. Udda minut med flit: Actions köar upp allt som
    # ligger på hel timme, och en jämn kvart ger längre väntetid.
    - cron: "12 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Två samtidiga insamlingar kan inte båda pusha -- den andra får "rejected
# (fetch first)" och kraschar. Det hände på riktigt första dagen, när en
# schemalagd körning och en manuell startade inom en minut. Kön ser till att
# de går efter varandra i stället.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kontrollera kärnan
        run: node --test collector/core.test.js

      # --no-trends med flit. Den odokumenterade Trends-endpointen svarar 429
      # från GitHub Actions IP-adresser -- de är delade och hårt trafikerade
      # av skrapare, så Google stryper dem i praktiken alltid. Första
      # nattkörningen bevisade det: 0 av 15 kategorier fick en siffra, alla
      # 429. Att fortsätta försöka kostar ett par minuters väntan per körning
      # för att garanterat få tillbaka femton felmeddelanden.
      #
      # Sökintresse kommer i stället in på två vägar:
      #   - CSV-import i appen (Importera Trends), fungerar idag
      #   - signals/google-trends-api.js, när alfa-nyckeln är på plats
      #
      # Heat viktar om sig automatiskt när signalen saknas, så korten blir
      # inte fel av det -- budkvoten står då för hela talet.
      - name: Kör insamlaren
        run: node collector/run.js --markets=SE --no-trends

      - name: Committa ny data
        run: |
          git config user.name "fyndindex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshot-latest.json
          if git diff --staged --quiet; then
            echo "Ingen förändring i datan -- inget att committa."
            exit 0
          fi
          git commit -m "Insamling $(date -u +%Y-%m-%d\ %H:%M)"
          # Även med concurrency-kön kan någon ha pushat under körningen,
          # som tar ett par minuter. Rebase och försök igen i stället för
          # att fälla jobbet på något som löser sig av sig självt.
          # Variabelnamnet MÅSTE vara ASCII. Hette den "försök" först, och
          # bash svarade "`försök': not a valid identifier" -- insamlingen
          # gick igenom men pushen dog på syntaxfelet. Samma fälla som
          # user-agenten i core/fetch.js: svensk text hör hemma i strängar
          # och kommentarer, aldrig i identifierare.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push avvisad (forsok $attempt) -- hamtar och rebasar."
            git pull --rebase --autostash origin main
          done
          echo "Kunde inte pusha efter tre försök."
          exit 1
